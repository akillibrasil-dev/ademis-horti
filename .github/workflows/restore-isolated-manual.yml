name: Ademis Horti — isolated restore (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/restore-isolated-manual.yml]
permissions:
  contents: read
concurrency:
  group: ademis-horti-one-time-restore
  cancel-in-progress: false
jobs:
  isolated-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned recovery test code (never main production)
        uses: actions/checkout@v4
        with:
          ref: 6f81b07a78556450354bf539b0d3543369a9d2ac
          persist-credentials: false
      - name: Install age and rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age rclone
      - name: Restore encrypted Drive backup to isolated disposable PostgreSQL
        env:
          ADEMIS_GDRIVE_RCLONE_CONFIG: ${{ secrets.ADEMIS_GDRIVE_RCLONE_CONFIG }}
          ADEMIS_AGE_RESTORE_TEST_KEY: ${{ secrets.ADEMIS_AGE_RESTORE_TEST_KEY }}
        run: bash scripts/backup/restore-smoke-test.sh
