name: Generate npm lockfile (one-time)
on:
  push:
    branches:
      - feat/fase-1-fundacao-saas
    paths:
      - .github/workflows/generate-lockfile.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reproducible npm resolution
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: lock npm dependency tree for Phase 1"
          git push origin HEAD:feat/fase-1-fundacao-saas
