name: Ademis Horti — encrypted Drive backup
on:
  # Push-triggered first test in the feature branch. Subsequent daily schedules
  # only run once this workflow is included in the repository default branch.
  push:
    branches:
      - feat/fase-1-fundacao-saas
    paths:
      - .github/workflows/backup-drive.yml
      - scripts/backup/export-drive-encrypted.sh
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'  # 03:17 Brasilia time (UTC-3); Actions may be delayed
permissions:
  contents: read
concurrency:
  group: ademis-horti-backup
  cancel-in-progress: false
jobs:
  export-encrypt-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ADEMIS_SUPABASE_DB_URL: ${{ secrets.ADEMIS_SUPABASE_DB_URL }}
      ADEMIS_AGE_RECIPIENT: ${{ secrets.ADEMIS_AGE_RECIPIENT }}
      ADEMIS_GDRIVE_RCLONE_CONFIG: ${{ secrets.ADEMIS_GDRIVE_RCLONE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone and age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age rclone
      - name: Run encrypted backup
        run: bash scripts/backup/export-drive-encrypted.sh
